<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Smart OPD Prototype</title>
<style>
:root{--bg:#f3fafb;--card:#fff;--tx:#12343b;--mut:#5d7b82;--teal:#0f9d9a;--lb:#dff3f7;--bd:#cfe5e9;--red:#d93636;--ora:#ee8a1c;--grn:#2e9e5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e2227;--card:#16333a;--tx:#e6f4f5;--mut:#9ab9be;--lb:#1c4048;--bd:#27505a}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#app{max-width:980px;margin:auto;padding:14px}h2{margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-size:16px;cursor:pointer;width:100%;margin:5px 0}
.btn.alt{background:var(--lb);color:var(--tx)}.btn.sm{width:auto;padding:8px 12px;font-size:14px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.grid.w{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tile{text-align:center;cursor:pointer}.tile .e{font-size:44px}.chip{display:inline-block;padding:7px 12px;border-radius:20px;background:var(--lb);margin:3px;cursor:pointer;border:2px solid transparent}.chip.on{border-color:var(--teal);font-weight:600}
.t-RED{background:var(--red)}.t-ORANGE{background:var(--ora)}.t-GREEN{background:var(--grn)}.tag{color:#fff;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700}
.alert{border-radius:14px;padding:12px;color:#fff;margin:10px 0}.stat{text-align:center;padding:10px}.stat b{font-size:24px;display:block}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;background:var(--teal);color:#fff;border:0;box-shadow:0 4px 14px #0004;cursor:pointer}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}.modal .card{width:100%;max-width:560px;max-height:92%;overflow:auto}
.slot{padding:8px 12px;border-radius:10px;border:1px solid var(--teal);margin:3px;cursor:pointer;background:var(--card);color:var(--tx)}.slot.on{background:var(--teal);color:#fff}.slot.x{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.av{font-size:34px;background:var(--lb);border-radius:50%;width:52px;height:52px;display:grid;place-items:center}.top{display:flex;justify-content:space-between;align-items:center}.note{font-size:12px;color:var(--mut)}
svg .part{fill:var(--lb);stroke:var(--teal);stroke-width:2;cursor:pointer}svg .part:hover,svg .part.on{fill:var(--teal)}svg text{fill:var(--tx);font-size:11px;pointer-events:none}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:14px;margin:6px 0;cursor:pointer;background:var(--card)}.srow.on{border-color:var(--teal);background:var(--lb);font-weight:600}.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sib{width:40px;height:40px;border-radius:12px;background:var(--lb);color:var(--teal);display:grid;place-items:center;flex:none}.srow.on .sib{background:var(--teal);color:#fff}.chk{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;color:transparent;flex:none}.srow.on .chk{background:var(--teal);border-color:var(--teal);color:#fff}.chk .ic{width:15px;height:15px;stroke-width:3}
.tile .e{color:var(--teal)}.e .ic{width:1em;height:1em;stroke-width:1.4}.av{color:var(--teal)}.av .ic{width:28px;height:28px}div[style*="font-size:70px"] .ic{width:1em;height:1em;color:var(--teal)}.btn .ic,.chip .ic{width:20px;height:20px;vertical-align:-4px;margin-right:6px}p .ic{width:18px;height:18px;vertical-align:-3px;margin-right:4px}h2 .ic{width:24px;height:24px;vertical-align:-4px;margin-right:6px;color:var(--teal)}.alert .ic{width:18px;height:18px;vertical-align:-3px;margin-right:4px}.top .btn.sm .ic{margin-right:4px}
svg text.lbl{fill:var(--tx);font-size:12px;font-weight:600;pointer-events:auto;cursor:pointer}svg text.lbl.on{fill:var(--teal)}svg g.part:hover,svg g.part.on{fill:var(--teal)}
.big{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.big .tile{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:24px;border-width:2px}.big .tile .e{font-size:110px;line-height:1}
.btn.back{display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:50%;margin:0;flex:none}.btn.back .ic{width:24px;height:24px;margin:0}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const L={en:{pl:'Patient Login',sl:'Hospital Staff Login',sp:'Specialities',sy:'Symptoms',cont:'Continue',book:'Book Appointment',home:'Back to Home',ask:'Ask AI assistant',hello:'Selected hospital'},
te:{pl:'రోగి లాగిన్',sl:'ఆసుపత్రి సిబ్బంది లాగిన్',sp:'ప్రత్యేకతలు',sy:'లక్షణాలు',cont:'కొనసాగించండి',book:'అపాయింట్‌మెంట్ బుక్ చేయండి',home:'హోమ్‌కు తిరిగి',ask:'AI సహాయకుడిని అడగండి',hello:'ఎంచుకున్న ఆసుపత్రి'},
hi:{pl:'मरीज लॉगिन',sl:'अस्पताल स्टाफ लॉगिन',sp:'विशेषज्ञताएँ',sy:'लक्षण',cont:'जारी रखें',book:'अपॉइंटमेंट बुक करें',home:'होम पर वापस',ask:'AI सहायक से पूछें',hello:'चयनित अस्पताल'},
ta:{pl:'நோயாளி உள்நுழைவு',sl:'மருத்துவமனை ஊழியர் உள்நுழைவு',sp:'சிறப்புகள்',sy:'அறிகுறிகள்',cont:'தொடரவும்',book:'முன்பதிவு செய்யவும்',home:'முகப்புக்கு',ask:'AI உதவியாளரிடம் கேளுங்கள்',hello:'தேர்ந்தெடுத்த மருத்துவமனை'},
kn:{pl:'ರೋಗಿ ಲಾಗಿನ್',sl:'ಆಸ್ಪತ್ರೆ ಸಿಬ್ಬಂದಿ ಲಾಗಿನ್',sp:'ವಿಶೇಷತೆಗಳು',sy:'ಲಕ್ಷಣಗಳು',cont:'ಮುಂದುವರಿಸಿ',book:'ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ಬುಕ್ ಮಾಡಿ',home:'ಮುಖಪುಟಕ್ಕೆ',ask:'AI ಸಹಾಯಕರನ್ನು ಕೇಳಿ',hello:'ಆಯ್ದ ಆಸ್ಪತ್ರೆ'}};
const LN={en:'English',te:'Telugu',hi:'Hindi',ta:'Tamil',kn:'Kannada'},LC={en:'en-IN',te:'te-IN',hi:'hi-IN',ta:'ta-IN',kn:'kn-IN'};
const t=k=>(L[S.lang]||L.en)[k]||L.en[k];
const HOSP=[{id:'h1',n:'Govt General Hospital, Tirupati',a:'Tirupati'},{id:'h2',n:'Area Hospital, Chittoor',a:'Chittoor'},{id:'h3',n:'District Hospital, Nellore',a:'Nellore'},{id:'h4',n:'Community Health Centre, Renigunta',a:'Renigunta Tirupati'},{id:'h5',n:'Govt General Hospital, Kakinada',a:'Kakinada'},{id:'h6',n:'Area Hospital, Rajahmundry',a:'Rajahmundry Rajamahendravaram Rajmundry Rajamundry'},{id:'h7',n:'King George Hospital, Visakhapatnam',a:'Visakhapatnam Vizag'},{id:'h8',n:'Govt General Hospital, Vijayawada',a:'Vijayawada'},{id:'h9',n:'Govt General Hospital, Guntur',a:'Guntur'}];
const EXTRA=[['d7','h5','Dr. Padma V','gm','👩‍⚕️'],['d8','h5','Dr. Satish B','car','👨‍⚕️'],['d9','h5','Dr. Kiran M','ort','👨‍⚕️'],['d10','h5','Dr. Rekha P','pul','👩‍⚕️'],['d11','h5','Dr. Naveen T','neu','👨‍⚕️'],['d12','h6','Dr. Anil G','gm','👨‍⚕️'],['d13','h7','Dr. Swathi R','gm','👩‍⚕️'],['d14','h8','Dr. Farah S','gm','👩‍⚕️'],['d15','h9','Dr. Mohan D','gm','👨‍⚕️']].map(x=>({id:x[0],h:x[1],n:x[2],sp:x[3],av:x[4],ct:['check','surg'],cap:1}));
['Srikakulam','Vizianagaram','Parvathipuram','Paderu','Anakapalli','Amalapuram','Bhimavaram','Eluru','Machilipatnam','Narasaraopet','Bapatla','Ongole','Kurnool','Nandyal','Anantapur','Puttaparthi','Kadapa','Rayachoti','Hyderabad','Warangal','Khammam','Karimnagar','Nizamabad','Chennai','Bengaluru'].forEach((p,i)=>HOSP.push({id:'g'+i,n:'Govt District Hospital, '+p,a:p}));
const SPEC=[['gm','General Medicine','🩺',0],['car','Cardiology','🫀',1],['neu','Neurology','🧠',1],['ort','Orthopedics','🦴',1],['der','Dermatology','🧴',0],['ent','ENT','👂',1],['oph','Ophthalmology','👁️',0],['ped','Pediatrics','🧸',0],['gyn','Gynecology','🌸',1],['sur','General Surgery','🔪',1],['den','Dentistry','🦷',0],['pul','Pulmonology','🫁',0]];
const SN=id=>SPEC.find(s=>s[0]==id)[1];
const BODY={Head:[['Headache','ORANGE','neu'],['Dizziness','ORANGE','neu'],['Fainting','RED','neu']],Eyes:[['Eye Pain','ORANGE','oph'],['Blurred Vision','ORANGE','oph']],Ears:[['Ear Pain','GREEN','ent'],['Hearing Loss','GREEN','ent']],'Nose/Throat':[['Sore Throat','GREEN','ent'],['Blocked Nose','GREEN','ent']],Chest:[['Chest Pain','RED','car'],['Breathing Difficulty','RED','pul'],['Cough','GREEN','pul']],Stomach:[['Stomach Pain','ORANGE','gm'],['Nausea','GREEN','gm']],Hands:[['Hand Pain','GREEN','ort'],['Swelling','GREEN','ort']],Legs:[['Leg Pain','GREEN','ort'],['Difficulty Walking','ORANGE','ort']],Skin:[['Rash','GREEN','der'],['Itching','GREEN','der']],'General Body':[['Fever','GREEN','gm'],['Weakness','GREEN','gm']]};
const SLOTS=['10:00','10:30','11:00','11:30','12:00'];
let S={lang:'en',stack:[]};
function load(){const r=load0();EXTRA.forEach(x=>{if(!r.docs.find(d=>d.id==x.id))r.docs.push(x)});(r.custom||[]).forEach(h=>{if(!HOSP.find(x=>x.id==h.id))HOSP.push(h)});const NM=['Rao','Reddy','Kumar','Sharma','Naidu','Iyer','Khan','Devi'],FN=['Anil','Sita','Ravi','Latha','Kiran','Meena','Suresh','Padma'];HOSP.forEach((h,i)=>SPEC.forEach((s,j)=>{const id='a'+h.id+s[0];if(!r.docs.find(d=>d.id==id||(d.h==h.id&&d.sp==s[0])))r.docs.push({id,h:h.id,n:'Dr. '+FN[(i+j)%8]+' '+NM[(i*3+j)%8],sp:s[0],av:j%2?'👨‍⚕️':'👩‍⚕️',ct:['check','surg'],cap:1})}));seedAppts(r);return r}
function seedAppts(r){r.appts=r.appts||[];const N=['Lakshmi','Ramesh','Sita','Venkat','Anitha','Suresh','Padma','Kiran','Meena','Raju','Kavitha','Srinivas','Divya','Mohan','Geeta','Harish','Swapna','Naveen','Rani','Prasad','Jyothi','Bhaskar','Usha','Ganesh'];const P=[['gm','Fever for 3 days','Fever, body weakness','GREEN'],['gm','Stomach pain, nausea','Abdominal pain with nausea','ORANGE'],['car','Chest pain on exertion','Chest pain, needs urgent ECG assessment','RED'],['pul','Cough and breathlessness','Cough with breathing difficulty','ORANGE'],['neu','Headache and dizziness','Recurrent headache with dizziness','ORANGE'],['ort','Knee pain','Knee pain while walking','GREEN'],['der','Skin rash','Itchy rash on arms','GREEN'],['ent','Ear pain','Ear pain, mild hearing loss','GREEN'],['oph','Blurred vision','Blurred vision for 2 weeks','ORANGE'],['ped','Child fever','Child with fever and cough','GREEN'],['gyn','Routine checkup','Routine gynecology checkup','GREEN'],['den','Toothache','Tooth pain with swelling','GREEN']];HOSP.forEach((h,hi)=>{const n=hi==0?24:8,cnt={};for(let i=0;i<n;i++){const id='S'+h.id+'_'+i;if(r.appts.find(a=>a.id==id))continue;const p=P[(i*5+hi)%P.length],red=p[3]=='RED',d=r.docs.find(x=>x.h==h.id&&x.sp==p[0]);if(!d)continue;const c=cnt[d.id]=(cnt[d.id]||0)+1,old=c>4;r.appts.push({id,h:h.id,doc:red?null:d.id,sp:p[0],pn:N[(i+hi*3)%N.length],age:p[0]=='ped'?4+i%9:20+(i*7+hi*5)%55,g:['Female','Male'][(i+hi)%2],prob:p[1],sum:p[2],reg:i%3==0?'Offline':'Online',tri:p[3],date:old?today(-1):today(),time:red?'IMMEDIATE':SLOTS[c%5],tok:i+2,vis:old||i%4==0})}})}
function load0(){try{const d=JSON.parse(localStorage.getItem('opd'));if(d)return d}catch(e){}return{docs:[{id:'d1',h:'h1',n:'Dr. Asha Rao',sp:'gm',av:'👩‍⚕️',ct:['check'],cap:1},{id:'d2',h:'h1',n:'Dr. Ravi Kumar',sp:'car',av:'👨‍⚕️',ct:['check','surg'],cap:1},{id:'d3',h:'h1',n:'Dr. Meena Iyer',sp:'neu',av:'👩‍⚕️',ct:['check','surg'],cap:1},{id:'d4',h:'h1',n:'Dr. Sunil Reddy',sp:'ort',av:'👨‍⚕️',ct:['check','surg'],cap:1},{id:'d5',h:'h1',n:'Dr. Latha S',sp:'pul',av:'👩‍⚕️',ct:['check'],cap:1},{id:'d6',h:'h2',n:'Dr. Imran Khan',sp:'gm',av:'👨‍⚕️',ct:['check'],cap:1}],appts:[{id:'A1',h:'h1',doc:'d1',sp:'gm',pn:'Lakshmi',age:54,g:'F',prob:'Fever 3 days',sum:'Fever, weakness',reg:'Offline',tri:'GREEN',date:today(),time:'10:00',tok:1,vis:false}]}}
function today(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)}
let DB=load();const save=()=>{try{localStorage.setItem('opd',JSON.stringify(DB))}catch(e){}};
window.addEventListener('storage',()=>{DB=load();if(S.cur=='dash')dash()});
function go(f,...a){S.stack.push([f,a]);S.cur=f.name;f(...a)}
function back(){S.stack.pop();const p=S.stack[S.stack.length-1];if(p){S.cur=p[0].name;p[0](...p[1])}}
const bar=(ti,bk=1)=>`<div class="top"><div class="row">${bk?`<button class="btn alt sm back" onclick="back()" aria-label="Back">${IC('arrow')}</button>`:''}<h2>${ti}</h2></div></div>`;
const R=h=>$('#app').innerHTML=EM(h);
function welcome(){R(`<div style="text-align:center;padding-top:40px"><div style="font-size:70px">🏥</div><h1>Smart OPD</h1><p class="note">AI-assisted government hospital triage · <b>PROTOTYPE with fictional data</b></p><div style="max-width:380px;margin:auto"><button class="btn" onclick="go(reg)">🧑 ${t('pl')}</button><button class="btn alt" onclick="go(login)">🩺 ${t('sl')}</button></div></div>`)}
function reg(){R(bar('Patient Registration')+`<div class="card"><label>Preferred Language</label><select id="lg" onchange="S.lang=this.value;reg()">${Object.entries(LN).map(([k,v])=>`<option value="${k}" ${k==S.lang?'selected':''}>${v}</option>`)}</select>
<label>Name</label><input id="nm"><div class="row"><div style="flex:1"><label>Age</label><input id="ag" type="number"></div><div style="flex:1"><label>Gender</label><select id="gn"><option>Female</option><option>Male</option><option>Other</option></select></div></div>
<label>Phone</label><input id="ph" type="tel"><label>Area (type to search hospitals)</label><input id="ar" oninput="hs()" placeholder="e.g. Tirupati"><div id="hl"></div><p id="er" style="color:var(--red)"></p><button class="btn" onclick="regGo()">${t('cont')}</button></div>`);hs()}
function hs(){const q=($('#ar')||{value:''}).value.toLowerCase();$('#hl').innerHTML=HOSP.filter(h=>(h.n+h.a).toLowerCase().includes(q)).map(h=>`<span class="chip ${S.hosp==h.id?'on':''}" onclick="S.hosp='${h.id}';hs()">🏥 ${h.n}</span>`).join('')||(q.length>2?`<span class="chip" onclick="addH()">➕ Add "${$('#ar').value.trim().replace(/[<>"'&]/g,'')}" Govt Hospital</span>`:'<span class="note">No hospital found</span>');$('#hl').innerHTML=EM($('#hl').innerHTML)}
function addH(){const a=$('#ar').value.trim().replace(/[<>"'&]/g,'');const h={id:'x'+Date.now()%1e6,n:'Govt Hospital, '+a,a};DB.custom=DB.custom||[];DB.custom.push(h);HOSP.push(h);save();DB=load();S.hosp=h.id;hs()}
function regGo(){const n=$('#nm').value.trim(),a=+$('#ag').value,p=$('#ph').value.trim();let e='';if(!n)e='Enter name';else if(!(a>0&&a<120))e='Enter valid age';else if(!/^\d{10}$/.test(p))e='Phone must be 10 digits';else if(!S.hosp)e='Select a hospital';$('#er').textContent=e;if(e)return;S.pat={id:'P'+Date.now()%1e6,n,age:a,g:$('#gn').value,ph:p};S.stack=[[welcome,[]]];go(phome)}
function phome(){const h=HOSP.find(x=>x.id==S.hosp);R(`<div class="top"><div class="row" style="flex-wrap:nowrap"><button class="btn alt sm back" onclick="back()" aria-label="Back">${IC('arrow')}</button><div><div class="note">${t('hello')}</div><b>🏥 ${h.n}</b></div></div><button class="btn sm" onclick="go(ai)" title="${t('ask')}">🎙️ AI</button></div><div class="grid big" style="margin-top:20px"><div class="card tile" onclick="go(specs)"><div class="e">🩺</div><b>${t('sp')}</b></div><div class="card tile" onclick="S.sel=[];go(bodyMap)"><div class="e">🧍</div><b>${t('sy')}</b></div></div><p class="note">Hi ${S.pat.n} · ID ${S.pat.id} · ${LN[S.lang]}</p>`)}
async function speak(x){try{const u=new SpeechSynthesisUtterance(x);u.lang=LC[S.lang];speechSynthesis.speak(u)}catch(e){}}
function mic(cb){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition not supported in this browser — type instead.');return}const r=new SR();r.lang=LC[S.lang];r.onresult=e=>cb(e.results[0][0].transcript);r.start()}
function ai(){R(bar(t('ask'))+`<div class="card"><div id="chat" style="min-height:120px" class="note">Ask about the OPD process, specialities or symptoms. (General information only — not a diagnosis.)</div><div class="row"><input id="q" style="flex:1;margin:0"><button class="btn sm" onclick="mic(v=>{$('#q').value=v;ask()})">🎤</button><button class="btn sm" onclick="ask()">Send</button></div></div>`)}
function ask(){const q=$('#q').value;if(!q)return;const l=q.toLowerCase();let a='I can help you pick a speciality or symptoms. A nurse will verify any assessment. For severe symptoms, go to Emergency now.';if(/chest|breath/.test(l))a='Chest pain or breathing trouble can be serious. Please seek emergency care immediately.';else if(/fever|cough/.test(l))a='Fever and cough are usually seen under General Medicine. Use Symptoms to book.';else if(/book|appointment/.test(l))a='Choose a speciality or symptoms from Home, then pick a doctor and slot.';$('#chat').innerHTML+=`<p><b>You:</b> ${q}</p><p><b>AI:</b> ${a}</p>`;$('#q').value='';speak(a)}

<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(105px,1fr))">${[['Total',1],['Online',fs.Online],['Offline',fs.Offline],['Emergency',fs.Emergency],['Urgent',fs.Urgent],['Routine',fs.Routine],['Visited',fs.Visited],['Not Visited',fs['Not Visited']]].map(([n,f])=>`<div class="card stat"><b>${c(f==1?()=>1:f)}</b>${n}</div>`).join('')}</div>
<div style="margin:10px 0">${Object.keys(fs).map(k=>`<span class="chip ${S.fl==k?'on':''}" onclick="S.fl='${k}';dash()">${k}</span>`).join('')}</div>
<div class="grid w">${list.map(a=>{const d=DB.docs.find(x=>x.id==a.doc);return`<div class="card"><div class="row"><div class="av">${d?d.av:'🚨'}</div><div><b>${d?d.n:'Emergency desk'}</b><br><span class="note">${SN(a.sp)}</span></div><span class="tag t-${a.tri}" style="margin-left:auto">${a.tri}</span></div><p><b>${a.pn}</b>, ${a.age} ${a.g}<br>${a.prob}<br><span class="note">AI: ${a.sum}</span></p><p class="note">${a.reg} · ${a.date} ${a.time} · Token ${a.tok}</p><div class="row"><button class="btn sm" style="background:var(--grn);${a.vis?'':'opacity:.5'}" onclick="vs('${a.id}',1)">VISITED</button><button class="btn sm" style="background:var(--red);${a.vis?'opacity:.5':''}" onclick="vs('${a.id}',0)">NOT VISITED</button>${a.tri!='RED'?`<button class="btn alt sm" onclick="ovr('${a.id}')">Override urgency</button>`:''}</div></div>`}).join('')||'<p>No patients match.</p>'}</div><button class="fab" onclick="off()">+</button>`)}
function vs(id,v){DB=load();DB.appts.find(a=>a.id==id).vis=!!v;save();dash()}
function ovr(id){const v=prompt('Verified urgency: RED, ORANGE or GREEN');if(!/^(RED|ORANGE|GREEN)$/.test(v||''))return;DB=load();DB.appts.find(a=>a.id==id).tri=v;save();dash()}
function off(){const hid=STAFF[S.staff][1];const m=document.createElement('div');m.className='modal';m.id='md';m.innerHTML=`<div class="card"><h3>Offline Registration</h3><input id="on" placeholder="Patient name"><div class="row"><input id="oa" type="number" placeholder="Age" style="flex:1"><select id="og" style="flex:1"><option>Female</option><option>Male</option><option>Other</option></select></div><input id="op" placeholder="Phone"><textarea id="opr" placeholder="Problem" rows="2"></textarea><div class="row"><button class="btn alt sm" onclick="mic(v=>{$('#opr').value=v;ai2()})">🎤 AI Voice (consent required)</button><button class="btn alt sm" onclick="ai2()">AI Summary</button></div><textarea id="osm" placeholder="AI summary (nurse can edit)" rows="2"></textarea><select id="odo">${DB.docs.filter(d=>d.h==hid).map(d=>`<option value="${d.id}">${d.n} (${SN(d.sp)})</option>`)}</select><select id="otr"><option>GREEN</option><option>ORANGE</option><option>RED</option></select><select id="otm">${SLOTS.map(s=>`<option>${s}</option>`)}</select><p id="oer" style="color:var(--red)"></p><button class="btn" onclick="regOff('${hid}')">Register Patient</button><button class="btn alt" onclick="$('#md').remove()">Cancel</button></div>`;m.innerHTML=EM(m.innerHTML);document.body.appendChild(m)}
function ai2(){const p=$('#opr').value,l=p.toLowerCase();const r=/chest|breath|unconscious|bleed|stroke/.test(l),o=/severe|dizz|vomit|fracture/.test(l);$('#otr').value=r?'RED':o?'ORANGE':'GREEN';$('#osm').value=`Reported: ${p}. AI-suggested urgency ${$('#otr').value} (needs nurse verification).`;if(r)alert('Possible emergency warning signs — immediate clinical assessment required.')}
function regOff(hid){const n=$('#on').value.trim(),a=+$('#oa').value,p=$('#op').value.trim();if(!n||!(a>0)||!/^\d{10}$/.test(p)||!$('#opr').value.trim()){$('#oer').textContent='Fill name, valid age, 10-digit phone and problem';return}DB=load();const dc=$('#odo').value,tr=$('#otr').value,tm=tr=='RED'?'IMMEDIATE':$('#otm').value,dt=today();if(tr!='RED'&&taken(dc,dt,tm)){$('#oer').textContent='Doctor slot already booked';return}DB.appts.push({id:'OFF'+Date.now()%1e7,h:hid,doc:tr=='RED'?null:dc,sp:DB.docs.find(d=>d.id==dc).sp,pn:n,age:a,g:$('#og').value,prob:$('#opr').value,sum:$('#osm').value||$('#opr').value,reg:'Offline',tri:tr,date:dt,time:tm,tok:DB.appts.filter(x=>x.h==hid&&x.date==dt).length+1,vis:false});save();$('#md').remove();dash();alert('Patient registered successfully')}
function docm(){const hid=STAFF[S.staff][1];R(bar('Doctor Management')+`<div class="card"><input id="dn" placeholder="Doctor name"><select id="ds">${SPEC.map(s=>`<option value="${s[0]}">${s[1]}</option>`)}</select><button class="btn" onclick="addDoc('${hid}')">Add doctor</button><p class="note">Prototype: admin role, image upload, working days & capacity are simplified; slots are fixed.</p></div>`+DB.docs.filter(d=>d.h==hid).map(d=>`<div class="card row" style="margin:8px 0"><div class="av">${d.av}</div><div><b>${d.n}</b><br><span class="note">${SN(d.sp)}</span></div></div>`).join(''))}
function addDoc(h){const n=$('#dn').value.trim();if(!n)return;DB.docs.push({id:'d'+Date.now()%1e6,h,n,sp:$('#ds').value,av:'🧑‍⚕️',ct:['check','surg'],cap:1});save();docm()}
welcome();
</script></body></html>
